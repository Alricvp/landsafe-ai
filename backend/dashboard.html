<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landsafe AI - Tilt Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 50%, #1b2838 100%);
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---- Header ---- */
    .header {
      background: rgba(15, 25, 40, 0.9);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3333;
      transition: background 0.3s;
    }
    .dot.connected { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

    .status-badge {
      font-size: 0.7rem;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .badge-safe { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .badge-warning { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.4); animation: pulse-yellow 1s infinite; }
    .badge-danger { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid rgba(255, 51, 51, 0.4); animation: pulse-red 0.5s infinite; }

    @keyframes pulse-yellow { 0%, 100% { box-shadow: 0 0 5px rgba(255, 170, 0, 0.2); } 50% { box-shadow: 0 0 15px rgba(255, 170, 0, 0.5); } }
    @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 5px rgba(255, 51, 51, 0.2); } 50% { box-shadow: 0 0 25px rgba(255, 51, 51, 0.7); } }

    /* ---- Main Layout ---- */
    .main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 768px) { .main { grid-template-columns: 1fr; padding: 16px; gap: 16px; } }

    /* ---- Gauge ---- */
    .gauge-container {
      background: rgba(15, 25, 40, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 36px 32px;
      border: 1px solid rgba(0, 212, 255, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .gauge-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 80%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .gauge-wrapper {
      position: relative;
      width: 300px;
      height: 170px;
      margin: 0 auto 20px;
    }

    .gauge-bg {
      width: 300px;
      height: 150px;
      border-radius: 150px 150px 0 0;
      background: rgba(10, 15, 30, 0.8);
      border: 6px solid rgba(0, 212, 255, 0.2);
      border-bottom: none;
      position: relative;
      overflow: hidden;
    }

    .gauge-zone {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    .gauge-zone-green { background: conic-gradient(from 0.75turn, transparent 0%, rgba(0, 255, 136, 0.15) 30%, transparent 50%); }
    .gauge-zone-yellow { background: conic-gradient(from 0.65turn, transparent 0%, rgba(255, 170, 0, 0.1) 15%, transparent 30%); }
    .gauge-zone-red { background: conic-gradient(from 0.5turn, transparent 0%, rgba(255, 51, 51, 0.15) 25%, transparent 50%); }

    .gauge-needle {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 3px;
      height: 130px;
      background: linear-gradient(to top, rgba(255,255,255,0.8), #00d4ff);
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
    }

    .gauge-center {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #00d4ff, #0088aa);
      border-radius: 50%;
      z-index: 2;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
    }

    .gauge-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gauge-value {
      font-size: 4rem;
      font-weight: 800;
      margin: 16px 0 4px;
      transition: color 0.3s;
      font-variant-numeric: tabular-nums;
    }
    .gauge-value.safe { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
    .gauge-value.warning { color: #ffaa00; text-shadow: 0 0 20px rgba(255, 170, 0, 0.3); }
    .gauge-value.danger { color: #ff3333; text-shadow: 0 0 30px rgba(255, 51, 51, 0.5); animation: text-pulse 0.5s infinite; }

    @keyframes text-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .gauge-unit { font-size: 1rem; color: #555; margin-bottom: 4px; }
    .tilt-label { font-size: 0.85rem; color: #666; }

    .threshold-visual {
      display: flex;
      gap: 3px;
      margin-top: 16px;
      padding: 0 20px;
    }
    .threshold-bar { flex: 1; height: 5px; border-radius: 3px; background: #1a1a2e; }
    .threshold-bar.green { background: linear-gradient(90deg, #0d4a2e, #00ff88, #0d4a2e); }
    .threshold-bar.yellow { background: linear-gradient(90deg, #4a3a0d, #ffaa00, #4a3a0d); }
    .threshold-bar.red { background: linear-gradient(90deg, #4a0d0d, #ff3333, #4a0d0d); }

    /* ---- Sidebar ---- */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: rgba(15, 25, 40, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card h3 {
      font-size: 0.75rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #666; font-size: 0.8rem; }
    .info-value { color: #e0e0e0; font-weight: 600; font-size: 0.85rem; }

    /* ---- Sound Toggle ---- */
    .sound-toggle {
      background: rgba(30, 40, 60, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      transition: all 0.2s;
    }
    .sound-toggle:hover { background: rgba(40, 55, 80, 0.8); border-color: rgba(0, 212, 255, 0.3); }
    .sound-toggle.active { background: rgba(0, 255, 136, 0.1); border-color: rgba(0, 255, 136, 0.3); }
    .sound-toggle .sound-left { display: flex; align-items: center; gap: 10px; }
    .sound-toggle .sound-right { font-size: 1.2rem; }

    .sound-hint {
      font-size: 0.7rem;
      color: #444;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* ---- Log ---- */
    .log-list {
      max-height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222 transparent;
    }
    .log-entry {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .log-time { color: #444; white-space: nowrap; }
    .log-tilt { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .log-tilt.safe { color: #00ff88; }
    .log-tilt.warning { color: #ffaa00; }
    .log-tilt.danger { color: #ff3333; }

    /* ---- Alert Overlay ---- */
    .alert-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; pointer-events: none; }
    .alert-overlay.active-red { display: block; background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0.2) 0%, transparent 70%); animation: alert-flash 0.8s infinite; }
    .alert-overlay.active-yellow { display: block; background: radial-gradient(ellipse at center, rgba(255, 170, 0, 0.12) 0%, transparent 70%); animation: alert-flash 1.5s infinite; }
    @keyframes alert-flash { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* ---- Warning Banner ---- */
    .warning-banner { display: none; padding: 14px 20px; text-align: center; font-weight: 700; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }
    .warning-banner.yellow { display: block; background: linear-gradient(90deg, rgba(74, 58, 13, 0.9), rgba(107, 85, 16, 0.9), rgba(74, 58, 13, 0.9)); color: #ffaa00; border-bottom: 2px solid #ffaa00; animation: banner-flash 1.5s infinite; }
    .warning-banner.red { display: block; background: linear-gradient(90deg, rgba(74, 13, 13, 0.95), rgba(107, 16, 16, 0.95), rgba(74, 13, 13, 0.95)); color: #ff3333; border-bottom: 2px solid #ff3333; animation: banner-flash 0.5s infinite; }
    @keyframes banner-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* ---- Enable Sound Banner ---- */
    .enable-sound-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.85rem;
      z-index: 200;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .enable-sound-banner:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 6px 30px rgba(0, 212, 255, 0.6); }
  </style>
</head>
<body>
  <div id="alert-overlay" class="alert-overlay"></div>
  <div id="warning-banner" class="warning-banner"></div>
  <div id="enable-sound-banner" class="enable-sound-banner">🔊 TAP TO ENABLE SIREN</div>

  <div class="header">
    <h1>🌍 Landsafe AI</h1>
    <div class="header-right">
      <div class="connection-status">
        <div id="conn-dot" class="dot"></div>
        <span id="conn-text">Connecting...</span>
      </div>
      <span id="status-badge" class="status-badge badge-safe">SAFE</span>
    </div>
  </div>

  <div class="main">
    <div class="gauge-container">
      <div class="gauge-wrapper">
        <div class="gauge-bg">
          <div class="gauge-zone gauge-zone-green"></div>
          <div class="gauge-zone gauge-zone-yellow"></div>
          <div class="gauge-zone gauge-zone-red"></div>
          <div class="gauge-needle" id="needle"></div>
          <div class="gauge-center"></div>
        </div>
      </div>
      <div class="gauge-labels">
        <span>10°+ WARN</span>
        <span>0° LEVEL</span>
        <span>40°+ DANGER</span>
      </div>
      <div class="gauge-value safe" id="tilt-value">0.00°</div>
      <div class="gauge-unit">Tilt Angle</div>
      <div class="tilt-label" id="tilt-label">Waiting for sensor data...</div>
      <div class="threshold-visual">
        <div class="threshold-bar green"></div>
        <div class="threshold-bar green"></div>
        <div class="threshold-bar green"></div>
        <div class="threshold-bar yellow"></div>
        <div class="threshold-bar yellow"></div>
        <div class="threshold-bar yellow"></div>
        <div class="threshold-bar red"></div>
        <div class="threshold-bar red"></div>
        <div class="threshold-bar red"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>📡 Sensor Info</h3>
        <div class="info-row">
          <span class="info-label">Device</span>
          <span class="info-value" id="device-id">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="info-value" id="device-status">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Last Update</span>
          <span class="info-value" id="last-update">—</span>
        </div>
      </div>

      <div class="card">
        <h3>🔔 Siren Control</h3>
        <button id="sound-btn" class="sound-toggle" onclick="toggleSound()">
          <span class="sound-left">
            <span id="sound-icon">🔇</span>
            <span id="sound-text">Siren OFF</span>
          </span>
          <span class="sound-right" id="sound-status" style="color:#ff3333;">●</span>
        </button>
        <p class="sound-hint">Siren auto-plays when danger (>40°). Toggle to mute/unmute.</p>
      </div>

      <div class="card">
        <h3>📊 Live Log</h3>
        <div class="log-list" id="log-list">
          <div class="log-entry">
            <span class="log-time">--:--</span>
            <span class="log-tilt safe">Waiting for data...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = `${window.location.origin}/api/latest`;
    const HISTORY_URL = `${window.location.origin}/api/history`;

    let soundEnabled = false;
    let audioCtx = null;
    let sirenOsc = null;
    let sirenGain = null;
    let lastStatus = 'safe';
    let lastTimestamp = '';

    const needle = document.getElementById('needle');
    const tiltValue = document.getElementById('tilt-value');
    const tiltLabel = document.getElementById('tilt-label');
    const statusBadge = document.getElementById('status-badge');
    const connDot = document.getElementById('conn-dot');
    const connText = document.getElementById('conn-text');
    const deviceId = document.getElementById('device-id');
    const deviceStatus = document.getElementById('device-status');
    const lastUpdate = document.getElementById('last-update');
    const logList = document.getElementById('log-list');
    const alertOverlay = document.getElementById('alert-overlay');
    const warningBanner = document.getElementById('warning-banner');

    // ---- Enable audio on first click ----
    function enableAudio() {
      initAudio();
      document.getElementById('enable-sound-banner').style.display = 'none';
      document.removeEventListener('click', enableAudio);
      document.removeEventListener('touchstart', enableAudio);
    }
    document.addEventListener('click', enableAudio);
    document.addEventListener('touchstart', enableAudio);

    // ---- Poll ----
    async function pollData() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.data && json.data.timestamp !== lastTimestamp) {
          lastTimestamp = json.data.timestamp;
          updateDashboard(json.data);
          connDot.classList.add('connected');
          connText.textContent = 'Live';
        }
      } catch (e) {
        connDot.classList.remove('connected');
        connText.textContent = 'Offline';
      }
    }

    // ---- Update ----
    function updateDashboard(data) {
      const { tilt, status, device_id, timestamp } = data;

      const clampedTilt = Math.max(-90, Math.min(90, tilt));
      const rotation = (clampedTilt / 90) * 90;
      needle.style.transform = `translateX(-50%) rotate(${-rotation}deg)`;

      tiltValue.textContent = `${tilt.toFixed(2)}°`;
      tiltValue.className = `gauge-value ${status}`;
      tiltLabel.textContent = `Device: ${device_id}`;
      statusBadge.textContent = status.toUpperCase();
      statusBadge.className = `status-badge badge-${status}`;

      deviceId.textContent = device_id;
      deviceStatus.textContent = status.toUpperCase();
      deviceStatus.style.color = status === 'danger' ? '#ff3333' : status === 'warning' ? '#ffaa00' : '#00ff88';

      lastUpdate.textContent = new Date(timestamp).toLocaleTimeString();

      alertOverlay.className = 'alert-overlay';
      warningBanner.className = 'warning-banner';

      if (status === 'danger') {
        alertOverlay.classList.add('active-red');
        warningBanner.className = 'warning-banner red';
        warningBanner.textContent = '⚠️ DANGER — GROUND SHIFT DETECTED';
        if (audioCtx && soundEnabled) startSiren();
        // Vibrate phone: pattern [vibrate, pause, vibrate, pause...]
        if (navigator.vibrate) {
          navigator.vibrate([300, 100, 300, 100, 300, 100, 500]);
        }
      } else if (status === 'warning') {
        alertOverlay.classList.add('active-yellow');
        warningBanner.className = 'warning-banner yellow';
        warningBanner.textContent = '⚠ WARNING — TILT ANOMALY DETECTED';
        if (navigator.vibrate) {
          navigator.vibrate([200, 200, 200]);
        }
      } else {
        stopSiren();
        if (navigator.vibrate) navigator.vibrate(0);  // Stop vibration
      }

      addLogEntry(tilt, status, timestamp);
      lastStatus = status;
    }

    function addLogEntry(tilt, status, timestamp) {
      const time = new Date(timestamp).toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${time}</span><span class="log-tilt ${status}">${tilt.toFixed(2)}° ${status === 'danger' ? '🔴' : status === 'warning' ? '🟡' : '🟢'}</span>`;
      logList.insertBefore(entry, logList.firstChild);
      while (logList.children.length > 50) logList.removeChild(logList.lastChild);
    }

    // ---- Sound ----
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function startSiren() {
      initAudio();
      if (sirenOsc) return;
      sirenOsc = audioCtx.createOscillator();
      sirenGain = audioCtx.createGain();
      sirenOsc.type = 'sawtooth';
      sirenOsc.frequency.setValueAtTime(800, audioCtx.currentTime);
      sirenOsc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
      sirenOsc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.6);
      sirenGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      sirenOsc.connect(sirenGain);
      sirenGain.connect(audioCtx.destination);
      sirenOsc.start();
      sirenOsc.onended = () => {
        sirenOsc = null;
        if (lastStatus !== 'safe' && soundEnabled) startSiren();
      };
    }

    function stopSiren() {
      if (sirenOsc) { try { sirenOsc.stop(); } catch(e) {} sirenOsc = null; }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      const status = document.getElementById('sound-status');

      if (soundEnabled) {
        btn.classList.add('active');
        icon.textContent = '🔊';
        text.textContent = 'Siren ON';
        status.style.color = '#00ff88';
        initAudio();
        if (lastStatus !== 'safe') startSiren();
      } else {
        btn.classList.remove('active');
        icon.textContent = '🔇';
        text.textContent = 'Siren OFF';
        status.style.color = '#ff3333';
        stopSiren();
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch(HISTORY_URL);
        const json = await res.json();
        if (json.data && json.data.length > 0) {
          updateDashboard(json.data[json.data.length - 1]);
          json.data.slice(-20).forEach(d => addLogEntry(d.tilt, d.status, d.timestamp));
        }
      } catch (e) {}
    }

    loadHistory();
    setInterval(pollData, 1000);
  </script>
</body>
</html>
