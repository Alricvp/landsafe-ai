services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./data/synthetic:/app/data/synthetic
      - ./models:/app/models
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    profiles: ["ui"]          # start with: docker compose --profile ui up --build
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped
